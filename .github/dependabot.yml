# Dependabot (23/10/2026): una vez por semana revisa si React, Vite, React
# Router o el resto de las dependencias sacaron versiones nuevas, y abre un PR
# con el cambio armado. Los arreglos chicos (parches y menores) llegan juntos
# en un solo PR; las versiones grandes, de a una, porque pueden romper algo.
# Cada PR pasa por las pruebas automaticas (.github/workflows/pruebas.yml):
# si queda en verde, se puede aceptar. Los avisos de seguridad llegan aparte y
# en el momento.
#
# 2/11/2026: Vite y su plugin de React no suben de version mayor solos. Vite 8
# no instala con @vitejs/plugin-react 4.x (npm frena con ERESOLVE) y el plugin
# 4.7 llega hasta Vite 7. Pasar de Vite 5 a 7 es una tarea planificada, con el
# banco de pruebas completo, no un PR automatico. Parches y menores siguen.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Argentina/Cordoba
    open-pull-requests-limit: 5
    groups:
      menores:
        update-types: [minor, patch]
    ignore:
      - dependency-name: vite
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitejs/plugin-react"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "deps"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci"
