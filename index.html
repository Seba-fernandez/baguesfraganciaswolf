<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#240604" />
    <meta name="description" content="Fragancias inspiradas en los grandes perfumes de diseñador. Elegí, armá tu pedido y te lo confirmo por WhatsApp." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Bagues Grupo Wolf · Perfumes</title>
    <!-- La B de Melodrama en crema sobre vino (rediseño D). El SVG lleva la
         letra como trazo, no como texto: un favicon no carga fuentes. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="canonical" href="https://baguesfraganciaswolf.vercel.app/" />
    <!-- Agentic Resource Discovery: "ard" es la relación de la versión actual
         del spec, "ai-catalog" la anterior, que es la que todavía busca
         Lighthouse 13.5. Se declaran las dos. -->
    <link rel="ard" href="/.well-known/ard.json" />
    <link rel="ai-catalog" href="/.well-known/ai-catalog.json" />

    <!-- La base de datos está en otro origen: abrir la conexión temprano le
         ahorra al primer pedido el DNS, el TCP y el TLS (~300 ms en 4G). -->
    <link rel="preconnect" href="https://wynownataftnompltsok.supabase.co" crossorigin />

    <!-- Las tres fuentes que no se ven en la primera pantalla, fuera del camino
         crítico: media="print" hace que el navegador la baje sin bloquear el
         dibujado, y el onload la libera. Las cuatro que sí se ven están
         declaradas en el CSS, que viaja embebido en este mismo documento.
         Las dos del título sí van precargadas (23/10): desde que el hero
         espera a sus fuentes para aparecer (ver el script de abajo de todo),
         sin precarga la espera le costaba ~140 ms de LCP a la simulación de
         Lighthouse; con precarga quedó igual que antes (medido intercalado,
         en local). Son 27 kB. -->
    <link rel="preload" href="/fonts/melodrama-600.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/boska-italic-400.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      // La hoja se agrega recién en el evento `load`, no con el truco de
      // media="print" + onload: ese se libera apenas baja el archivo, y medido
      // en producción las fuentes que declara (23,8 kB solo la itálica) entraban
      // igual en la carga inicial, compitiendo con la imagen que define el LCP.
      // Las usa texto que está debajo del pliegue, así que puede esperar.
      addEventListener('load', function () {
        var l = document.createElement('link');
        l.rel = 'stylesheet';
        l.href = '/fuentes-diferidas.css';
        document.head.appendChild(l);
      });
    </script>
    <noscript><link rel="stylesheet" href="/fuentes-diferidas.css" /></noscript>

    <!-- La escena del hero es el elemento más grande de la primera pantalla y
         vive en un background-image, que el navegador no puede descubrir hasta
         parsear el CSS. Cada tamaño precarga solo el suyo, con prioridad alta. -->
    <!-- AVIF: con el mismo peso que el WebP de antes entra 1,5 veces la
         resolucion. Los iPhone son 3x: se veian borrosos con la de 780 (22/10).
         Las mismas media queries que Hero.module.css; un navegador sin AVIF
         saltea la precarga (type) y el CSS le da el WebP. -->
    <link rel="preload" href="/hero/c/hero_c_780x1688.avif" type="image/avif" as="image" media="(max-width: 599px) and (max-resolution: 2.49dppx)" fetchpriority="high" />
    <link rel="preload" href="/hero/c/hero_c_1170x2532.avif" type="image/avif" as="image" media="(max-width: 599px) and (min-resolution: 2.5dppx)" fetchpriority="high" />
    <link rel="preload" href="/hero/c/hero_c_1440x900.avif" type="image/avif" as="image" media="(min-width: 600px) and (max-width: 1600px) and (max-resolution: 1.49dppx)" fetchpriority="high" />
    <link rel="preload" href="/hero/c/hero_c_2880x1800.avif" type="image/avif" as="image" media="(min-width: 600px) and (min-resolution: 1.5dppx), (min-width: 1601px)" fetchpriority="high" />

    <!-- Open Graph: WhatsApp es el canal de venta. Sin esto el link pega gris. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Bagues Grupo Wolf" />
    <meta property="og:title" content="Bagues Grupo Wolf · Perfumes" />
    <meta property="og:description" content="Fragancias inspiradas en los grandes perfumes de diseñador. Elegí, armá tu pedido y te lo confirmo por WhatsApp." />
    <meta property="og:image" content="https://baguesfraganciaswolf.vercel.app/og.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="https://baguesfraganciaswolf.vercel.app/" />
    <meta property="og:locale" content="es_AR" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Bagues Grupo Wolf · Perfumes" />
    <meta name="twitter:description" content="Fragancias inspiradas en los grandes perfumes de diseñador. Armá tu pedido y te lo confirmo por WhatsApp." />
    <meta name="twitter:image" content="https://baguesfraganciaswolf.vercel.app/og.jpg" />

    <style>
      /* Reset mínimo y color de fondo, embebidos.
         Antes esto venía de global.css, que es la hoja del PANEL y arrancaba con
         un @import a Google Fonts: una request que bloquea el dibujado y que la
         tienda pagaba sin usar una sola de esas tres familias. La hoja se mudó
         adentro del panel; lo poco que la tienda necesitaba quedó acá, sin
         costar un viaje de red. */
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html { background: #17110d; }
      body {
        min-height: 100vh;
        background: #17110d;
        color: #f3ece1;
        font-family: system-ui, -apple-system, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      img { max-width: 100%; }

      /* La barra de la ventana la pinta el documento: si se declara solo
         dentro de la tienda, el navegador ya resolvio la del scroll principal. */
      html { scrollbar-width: thin; scrollbar-color: rgba(235,232,221,0.22) transparent; }
      html::-webkit-scrollbar { width: 11px; }
      html::-webkit-scrollbar-track { background: #17110d; }
      html::-webkit-scrollbar-thumb {
        background: rgba(235,232,221,0.18); border-radius: 999px;
        border: 3px solid #17110d; background-clip: content-box;
      }
      html::-webkit-scrollbar-thumb:hover { background: rgba(235,232,221,0.34); background-clip: content-box; }
    </style>

    <script>
      // Vuelta del ingreso con Google. Google redirige a la raíz con un ?code=,
      // y quien lo tiene que canjear es el panel. Antes eso obligaba a montar el
      // contexto de sesión —y con él el cliente de base de datos entero— en la
      // tienda pública, que no lo usa para nada.
      // Acá se desvía antes de que baje una sola línea del bundle, con la query
      // intacta para que el panel la procese.
      //
      // Supabase puede volver de tres formas: ?code= (flujo PKCE),
      // #access_token= (flujo implícito, el que usa supabase-js por defecto) o
      // con un error (?error= / #error=). Si se mira solo el ?code=, la vuelta
      // con el token en el hash se queda en la tienda y la sesión se pierde:
      // ese era el motivo de que el panel pidiera ingresar de nuevo sin fin.
      (function () {
        var l = window.location;
        var vuelta = /[?&](code|error)=/.test(l.search) || /(access_token|error)=/.test(l.hash);
        if (l.pathname === '/' && vuelta) {
          l.replace('/panel' + l.search + l.hash);
        }
      })();
    </script>
    <script>
      // Las letras del inicio esperan a sus fuentes (Sebas, 23/10): con red
      // lenta el titulo aparecia con la letra de respaldo y cambiaba a la
      // vista. Mientras dure la clase "fe", la entrada del hero queda en su
      // primer cuadro; cuando llegan las dos del titulo (o a los 0,9 s, lo que
      // pase antes) arranca toda junta. Figtree no se espera: su respaldo ya
      // tiene las mismas medidas y el cambio casi no se ve (y esperarla costaba
      // LCP). Sin JavaScript no hay clase y se ve
      // como siempre. Las fuentes se piden en el primer cuadro y no aca: el
      // build pega la hoja con los @font-face mas abajo, y antes de leerla
      // document.fonts.load no encuentra nada y contesta enseguida.
      (function () {
        var d = document.documentElement, f = document.fonts;
        if (!f || !f.load || !window.requestAnimationFrame || location.pathname !== '/') return;
        d.classList.add('fe');
        var listo = function () { d.classList.remove('fe'); };
        setTimeout(listo, 900);
        requestAnimationFrame(function () {
          Promise.all(['600 1em Melodrama', 'italic 400 1em Boska']
            .map(function (x) { return f.load(x); })).then(listo, listo);
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
